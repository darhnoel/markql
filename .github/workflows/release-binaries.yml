name: Release Agent + Extension

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: MinSizeRel
  MARKQL_BUILD_CLI: "OFF"
  MARKQL_BUILD_AGENT: "ON"
  MARKQL_BUILD_TESTS: "OFF"
  MARKQL_BUILD_PYTHON: "OFF"
  MARKQL_WITH_ARROW: "OFF"
  MARKQL_OPTIMIZE_FOR_SIZE: "ON"
  MARKQL_STRIP_BINARIES: "ON"

jobs:
  build-agent-linux:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: desktop-agent-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "${HOME}/vcpkg"
          "${HOME}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${HOME}/vcpkg" >> "${GITHUB_ENV}"

      - name: Build markql-agent
        env:
          CMAKE_BUILD_TYPE: ${{ env.BUILD_TYPE }}
        run: ./scripts/build/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: markql-agent-linux
          path: build/markql-agent

  build-agent-windows:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: desktop-agent-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:USERPROFILE\vcpkg"

      - name: Build markql-agent
        shell: bash
        env:
          CMAKE_BUILD_TYPE: ${{ env.BUILD_TYPE }}
          VCPKG_TARGET_TRIPLET: x64-windows-static
          VCPKG_HOST_TRIPLET: x64-windows-static
        run: ./scripts/build/build.sh

      - name: Locate markql-agent.exe
        shell: pwsh
        run: |
          $candidates = @(
            "build\MinSizeRel\markql-agent.exe",
            "build\Release\markql-agent.exe",
            "build\Debug\markql-agent.exe",
            "build\markql-agent.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Error "markql-agent.exe not found. Searched: $($candidates -join ', ')"
          }
          if ($found -match '\\Debug\\') {
            Write-Error "markql-agent.exe was built from a Debug configuration: $found"
          }
          "AGENT_EXE=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using agent artifact: $found"

      - name: Verify Windows agent runtime dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found; cannot inspect Windows binary dependencies."
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "Visual Studio installation path not found for dumpbin."
          }
          $dumpbin = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe') |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            Write-Error "dumpbin.exe not found under $vsPath"
          }
          $dependents = & $dumpbin.FullName /dependents $env:AGENT_EXE
          $dependents | Out-String | Write-Host
          foreach ($blocked in @('VCRUNTIME140D.dll', 'MSVCP140D.dll', 'brotlienc.dll')) {
            if ($dependents -match [regex]::Escape($blocked)) {
              Write-Error "Forbidden runtime dependency detected in packaged markql-agent.exe: $blocked"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: markql-agent-windows
          path: ${{ env.AGENT_EXE }}

  package-extension:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          mkdir -p dist/markql-extension
          cp -R browser_plugin/extension/. dist/markql-extension/
          cd dist
          zip -r markql-extension.zip markql-extension

      - uses: actions/upload-artifact@v4
        with:
          name: markql-extension
          path: dist/markql-extension.zip


  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs:
      - build-agent-linux
      - build-agent-windows
      - package-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/markql-agent
            dist/markql-agent.exe
            dist/*.zip
